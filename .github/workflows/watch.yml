name: GTA 6 Watcher

on:
  schedule:
    # Toutes les heures. Syntaxe cron : minute heure jour mois jour-semaine
    - cron: "0 * * * *"
  workflow_dispatch: {}  # permet de le lancer manuellement depuis l'onglet Actions

jobs:
  run-watcher:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer le watcher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
        run: python watcher.py

      - name: Commit et push des résultats + de la base de dédup
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add output/ seen_articles.db
          git diff --staged --quiet || git commit -m "Nouveaux articles GTA 6 [auto]"
          git push
